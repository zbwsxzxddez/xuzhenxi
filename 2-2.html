完整代码片段：

```
<html lang="en">
<body>

        <img src="./img/1.jpg" width="300">
    </a>

    <!--大扩展：表格，四行三列表格，带表头-->
    <table border="1">
        <thead>
            <tr>
                <th>表头1</th>
                <th>表头2</th>
                <th>表头3</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>内容1</td>
                <td>内容2</td>
                <td>内容3</td>
            </tr>
            <tr>

            </tr>
            <tr>
