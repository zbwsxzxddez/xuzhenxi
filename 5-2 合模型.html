<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒模型，框模型，box model</title>
    <style>
        body,ul,p,h1,h2,h3,h4,h5,h6{
           margin:0; 
           padding: 0;
        }
        .a{
            width: 200px;
            height: 200px;
            border: 2px dotted #039;
            padding: 70px 60px 50px 40px;/* 上 右 下 左 */
            margin: 40px auto;
            /* 上下 左右margin为auto则盒子居中 */
        }
        /* 盒子的高度：内容的高度+上下边框的高度+上下padding的高度+上下margin的高度 */
        .b{
            width: 500px;
            height: 300px;
            border: 2px dashed #039;
            margin:50px auto 40px;
        }
        /* c盒子：怪异盒模型 border-box，设置的width包含border+padding */
        .c{
            width: 300px;
            height: 150px;
            border: 4px solid #c36;
            padding: 20px;
            margin: 30px auto;
            box-sizing: border-box; /* IE盒模型，宽高包含边框+内边距 */
            background-color: #fceef4;
        }
    </style>
</head>
<body>
    <div class="a">115许镇玺</div>
    <div class="b">115许镇玺</div>
    <div class="c">115许镇玺 — c盒子（border‑box盒模型）</div>
</body>
</html>
