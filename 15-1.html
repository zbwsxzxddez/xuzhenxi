<!-- 姓名：许镇玺，日期：数7游戏100盒 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="许镇玺">
<title>许镇玺 · 数7游戏 100 盒子</title>
<style>
/* ============================================================
   许镇玺 · 数7游戏 100 盒子
   规则：7 的倍数 或 末尾是 7 的数 → 空盒子；其余 → 显示数字
   纯原生 HTML/CSS/JavaScript，无 CDN 依赖
   ============================================================ */

:root{
  --xzx_bg:        #f5f1e8;
  --xzx_surface:   #fbf8f1;
  --xzx_text:      #222b28;
  --xzx_muted:     #7d7666;
  --xzx_line:      #e2dac6;
  --xzx_primary:   #b23c28;
  --xzx_primary-2: #93301f;
  --xzx_accent:    #154943;
  --xzx_empty:     #e8e0cc;
  --xzx_radius:    12px;
  --xzx_font:      "PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  --xzx_mono:      Consolas,"Courier New",monospace;
  --xzx_shadow:    0 12px 30px -16px rgba(31,42,40,.35);
}

*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:var(--xzx_font);
  color:var(--xzx_text);
  background:var(--xzx_bg);
  line-height:1.7;
  padding:40px 18px 64px;
}
.xzx_wrap{width:min(960px,94%);margin:0 auto;}

/* ---------- 头部 ---------- */
.xzx_hero{text-align:center;margin-bottom:30px;}
.xzx_kicker{
  font-family:var(--xzx_mono);
  font-size:12px;letter-spacing:.34em;text-transform:uppercase;
  color:var(--xzx_primary);margin-bottom:14px;
}
.xzx_hero h1{
  font-size:clamp(26px,4.6vw,42px);line-height:1.3;letter-spacing:.04em;
}
.xzx_hero h1 em{
  font-style:normal;color:var(--xzx_primary);
  background:linear-gradient(transparent 62%, rgba(178,60,40,.18) 62%);
}
.xzx_hero p{color:var(--xzx_muted);margin-top:14px;font-size:15px;}

/* ---------- 规则说明 ---------- */
.xzx_rules{
  background:var(--xzx_surface);
  border:1px solid var(--xzx_line);
  border-radius:var(--xzx_radius);
  padding:18px 22px;margin-bottom:26px;
  box-shadow:var(--xzx_shadow);
  display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:center;
}
.xzx_rule_item{
  display:flex;align-items:center;gap:10px;font-size:14px;color:var(--xzx_muted);
}
.xzx_rule_box{
  width:26px;height:26px;border-radius:6px;display:flex;
  align-items:center;justify-content:center;font-size:13px;font-weight:700;
}
.xzx_rule_box.xzx_fill{background:var(--xzx_accent);color:#fff;}
.xzx_rule_box.xzx_skip{background:var(--xzx_empty);color:var(--xzx_muted);border:1px dashed var(--xzx_muted);}
.xzx_rule_box.xzx_name{background:var(--xzx_primary);color:#fff;font-size:12px;}

/* ---------- 盒子网格 ---------- */
.xzx_grid{
  display:grid;grid-template-columns:repeat(10,1fr);gap:8px;
  background:var(--xzx_surface);
  border:1px solid var(--xzx_line);
  border-radius:var(--xzx_radius);
  padding:18px;
  box-shadow:var(--xzx_shadow);
}
.xzx_box{
  aspect-ratio:1/1;
  display:flex;align-items:center;justify-content:center;
  border-radius:8px;
  font-family:var(--xzx_mono);
  font-size:clamp(13px,2.4vw,18px);
  font-weight:600;
  transition:transform .15s ease, box-shadow .15s ease;
  cursor:default;
}
.xzx_box.xzx_fill{
  background:var(--xzx_accent);
  color:#fff;
  box-shadow:0 4px 10px -4px rgba(21,73,67,.4);
}
.xzx_box.xzx_fill:hover{
  transform:scale(1.08);
  box-shadow:0 6px 16px -4px rgba(21,73,67,.55);
}
.xzx_box.xzx_skip{
  background:var(--xzx_empty);
  color:var(--xzx_muted);
  border:1px dashed var(--xzx_muted);
  font-size:0;
}
.xzx_box.xzx_skip:hover{
  transform:scale(1.05);
  background:#ddd3b8;
}
.xzx_box.xzx_skip::before{
  content:"";
  width:8px;height:8px;border-radius:50%;
  background:var(--xzx_muted);
  opacity:.5;
}

/* ---------- 姓名展示 ---------- */
.xzx_name_badge{
  display:inline-flex;align-items:center;gap:8px;
  font-size:16px;font-weight:700;color:var(--xzx_primary);
  background:rgba(178,60,40,.08);
  border:1px solid rgba(178,60,40,.2);
  border-radius:999px;padding:8px 20px;
  margin-top:24px;
}
.xzx_name_badge::before{
  content:"";width:10px;height:10px;border-radius:50%;
  background:var(--xzx_primary);
}

/* ---------- 页脚 ---------- */
.xzx_foot{
  text-align:center;color:var(--xzx_muted);font-size:13.5px;
  border-top:1px solid var(--xzx_line);padding-top:20px;margin-top:24px;
}
.xzx_foot b{color:var(--xzx_primary);}

/* ---------- 响应式 ---------- */
@media(max-width:640px){
  .xzx_grid{gap:5px;padding:10px;}
  .xzx_rules{flex-direction:column;align-items:flex-start;}
}
</style>
</head>
<body>

<div class="xzx_wrap">

  <header class="xzx_hero">
    <p class="xzx_kicker">Count 7 Game · 100 Boxes</p>
    <h1><em>许镇玺</em> · 数7游戏 100 盒子</h1>
    <p>从 1 到 100，凡是 7 的倍数或末尾是 7 的数，显示为空盒子；其余数字正常显示。</p>
  </header>

  <!-- 规则图例 -->
  <section class="xzx_rules">
    <div class="xzx_rule_item">
      <span class="xzx_rule_box xzx_fill">5</span>
      <span>普通数字 → 显示数字</span>
    </div>
    <div class="xzx_rule_item">
      <span class="xzx_rule_box xzx_skip">·</span>
      <span>7 的倍数 / 末尾是 7 → 空盒子</span>
    </div>
    <div class="xzx_rule_item">
      <span class="xzx_rule_box xzx_name">玺</span>
      <span>作者：许镇玺</span>
    </div>
  </section>

  <!-- 100 个盒子（JS 动态生成） -->
  <div class="xzx_grid" id="xzx_grid"></div>

  <!-- 姓名展示 -->
  <div style="text-align:center;">
    <span class="xzx_name_badge">许镇玺</span>
  </div>

  <footer class="xzx_foot">
    <b>许镇玺</b> ·《高级网页设计》课堂实践 — 数7游戏 100 盒子，原生代码手写，无 CDN 依赖
  </footer>

</div>

<script>
/* ============================================================
   许镇玺 · 数7游戏
   所有变量以 xzx_ 开头
   规则：i % 7 === 0  ||  i % 10 === 7  → 空盒子
   ============================================================ */

(function(){
  var xzx_grid = document.getElementById('xzx_grid');
  var xzx_html = '';

  for (var xzx_i = 1; xzx_i <= 100; xzx_i++) {
    var xzx_isSkip = (xzx_i % 7 === 0) || (xzx_i % 10 === 7);
    var xzx_cls = xzx_isSkip ? 'xzx_box xzx_skip' : 'xzx_box xzx_fill';
    var xzx_content = xzx_isSkip ? '' : xzx_i;
    xzx_html += '<div class="' + xzx_cls + '">' + xzx_content + '</div>';
  }

  xzx_grid.innerHTML = xzx_html;
})();
</script>
</body>
</html>
