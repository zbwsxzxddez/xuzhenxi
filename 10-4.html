<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10-4 media query layout</title>
  <style>
    :root {
      font-size: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f2f2;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    .wrap {
      width: 90%;
      max-width: 1000px;
      margin: 2rem auto;
    }

    .title {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 1.5rem;
      color: #222;
      letter-spacing: 0.1rem;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .item {
      flex: 1 1 25%;
      min-width: 120px;
      height: 120px;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      border-radius: 0.75rem;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 1.25rem;
      font-weight: bold;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.08);
    }

    @media (max-width: 900px) {
      .item {
        flex-basis: 33.333%;
      }
    }

    @media (max-width: 700px) {
      .item {
        flex-basis: 50%;
      }
    }

    @media (max-width: 480px) {
      .item {
        flex-basis: 100%;
      }

      .title {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title">许镇玺</div>
    <div class="grid">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
      <div class="item">5</div>
      <div class="item">6</div>
      <div class="item">7</div>
      <div class="item">8</div>
    </div>
  </div>
</body>
</html>
