<!-- 姓名：许镇玺，日期：一左一右-tab导航栏 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一左一右-tab导航栏</title>
    <style>
        /*全局CSS*/
        *{margin: 0;padding: 0;}
        a{text-decoration: none;color: inherit;}

        .xzx_container{
            max-width: 1000px;
            margin: 20px;
        }

        /* tab导航栏 - 一左一右布局 */
        .xzx_tab_bar{
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #e8e8e8;
            padding-bottom: 10px;
        }

        /* 左边主标题 */
        .xzx_tab_title{
            font-size: 20px;
            font-weight: bold;
            color: #333;
            position: relative;
            padding-bottom: 10px;
            margin-bottom: -12px;
        }

        /* 选中状态的红色下划线 */
        .xzx_tab_title::after{
            content: "";
            position: absolute;
            left: 0;
            bottom: -12px;
            width: 100%;
            height: 2px;
            background: #e02020;
        }

        /* 右边tab列表 */
        .xzx_tab_list{
            display: flex;
            gap: 24px;
            font-size: 14px;
            color: #666;
        }

        .xzx_tab_list a{
            transition: color 0.2s;
        }

        .xzx_tab_list a:hover{
            color: #e02020;
        }

        /* 第二个示例：带"更多"的标题栏 */
        .xzx_section_title{
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 40px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e8e8e8;
        }

        .xzx_section_left{
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        /* 火焰图标效果 */
        .xzx_section_left::before{
            content: "🔥";
            font-size: 18px;
        }

        .xzx_more_link{
            font-size: 13px;
            color: #999;
        }

        .xzx_more_link:hover{
            color: #e02020;
        }

        /* 手机端适配 */
        @media (max-width: 480px){
            .xzx_tab_bar{
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .xzx_tab_list{
                gap: 16px;
                flex-wrap: wrap;
            }
            .xzx_tab_title{
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="xzx_container">
        <!-- 第一种：tab切换式标题栏 -->
        <div class="xzx_tab_bar">
            <div class="xzx_tab_title">国际足球</div>
            <nav class="xzx_tab_list">
                <a href="#">中国足球</a>
                <a href="#">NBA</a>
                <a href="#">CBA</a>
                <a href="#">综合</a>
            </nav>
        </div>

        <!-- 第二种：左标题右"更多"标题栏 -->
        <div class="xzx_section_title">
            <div class="xzx_section_left">热门资讯</div>
            <a href="#" class="xzx_more_link">更多 &gt;</a>
        </div>

        <!-- 第三种：左标题右tab -->
        <div class="xzx_tab_bar" style="margin-top: 40px;">
            <div class="xzx_tab_title">NBA</div>
            <nav class="xzx_tab_list">
                <a href="#">CBA</a>
                <a href="#">英超</a>
                <a href="#">西甲</a>
                <a href="#">意甲</a>
            </nav>
        </div>
    </div>
</body>
</html>
