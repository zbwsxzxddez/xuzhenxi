<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D立体画廊</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            overflow: hidden;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            perspective: 1500px;
        }

        .xzx_scene {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
        }

        .xzx_gallery {
            position: relative;
            width: 300px;
            height: 200px;
            transform-style: preserve-3d;
            animation: xzx_autoRotate 40s linear infinite;
        }

        .xzx_gallery:hover {
            animation-play-state: paused;
        }

        .xzx_frame {
            position: absolute;
            width: 380px;
            height: 250px;
            left: 0;
            top: 0;
            transform-style: preserve-3d;
            transform-origin: center center;
            transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .xzx_gallery:hover .xzx_frame {
            cursor: pointer;
        }

        .xzx_frame:hover {
            transform: translateZ(280px) rotateY(0deg) scale(1.25) !important;
            z-index: 100 !important;
        }

        .xzx_frame_inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            border: 12px solid;
            border-image: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 50%, #f5f7fa 100%) 1;
            box-shadow: 
                0 10px 60px rgba(255, 255, 255, 0.15),
                inset 0 0 40px rgba(0, 0, 0, 0.5);
            background: #000;
            overflow: hidden;
            transition: all 0.6s ease;
        }

        .xzx_frame:hover .xzx_frame_inner {
            border-image: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%) 1;
            box-shadow: 
                0 20px 100px rgba(79, 172, 254, 0.6),
                0 0 80px rgba(0, 242, 254, 0.4) inset;
        }

        .xzx_img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.9) contrast(1.1) saturate(1.1);
            transition: all 0.6s ease;
            transform: scale(1.05);
        }

        .xzx_frame:hover .xzx_img {
            filter: brightness(1.1) contrast(1.2) saturate(1.3) blur(0px);
            transform: scale(1.15);
        }

        .xzx_glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 40%, rgba(79, 172, 254, 0.3) 100%);
            mix-blend-mode: screen;
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }

        .xzx_frame:hover .xzx_glow {
            opacity: 1;
        }

        .xzx_caption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.5) 50%, transparent 100%);
            color: #fff;
            transform: translateY(100%);
            transition: transform 0.6s ease;
            font-size: 1.1em;
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .xzx_frame:hover .xzx_caption {
            transform: translateY(0);
        }

        .xzx_info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #fff;
            z-index: 10;
            pointer-events: none;
            animation: xzx_fadeIn 2s ease;
        }

        .xzx_info h1 {
            font-size: clamp(2em, 4vw, 3.5em);
            margin-bottom: 10px;
            background: linear-gradient(45deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            letter-spacing: 3px;
            text-shadow: 0 0 30px rgba(79, 172, 254, 0.5);
        }

        .xzx_info p {
            font-size: clamp(0.8em, 1.5vw, 1em);
            opacity: 0.7;
            letter-spacing: 2px;
        }

        .xzx_back_btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: #fff;
            text-decoration: none;
            padding: 12px 35px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.4s ease;
            pointer-events: auto;
        }

        .xzx_back_btn:hover {
            background: rgba(79, 172, 254, 0.3);
            border-color: rgba(0, 242, 254, 0.6);
            box-shadow: 0 0 30px rgba(79, 172, 254, 0.5);
            transform: translateX(-50%) translateY(-3px);
        }

        .xzx_particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .xzx_particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #00f2fe;
            border-radius: 50%;
            box-shadow: 0 0 10px #4facfe;
            animation: xzx_float 20s infinite;
        }

        @keyframes xzx_autoRotate {
            from {
                transform: rotateY(0deg);
            }
            to {
                transform: rotateY(-360deg);
            }
        }

        @keyframes xzx_fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @keyframes xzx_float {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100vw);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="xzx_particles" id="xzx_particles"></div>

    <div class="xzx_info">
        <h1>3D 立体画廊</h1>
        <p>悬停图片可放大查看 · 使用img目录图片</p>
    </div>

    <div class="xzx_scene">
        <div class="xzx_gallery" id="xzx_gallery">
            <div class="xzx_frame">
                <div class="xzx_frame_inner">
                    <img src="img/1.jpg" alt="图片1" class="xzx_img" onerror="this.src='https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&h=500&fit=crop'">
                    <div class="xzx_glow"></div>
                    <div class="xzx_caption">山水意境 · 自然之美</div>
                </div>
            </div>
            <div class="xzx_frame">
                <div class="xzx_frame_inner">
                    <img src="img/2.jpg" alt="图片2" class="xzx_img" onerror="this.src='https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=800&h=500&fit=crop'">
                    <div class="xzx_glow"></div>
                    <div class="xzx_caption">湖光山色 · 宁静致远</div>
                </div>
            </div>
            <div class="xzx_frame">
                <div class="xzx_frame_inner">
                    <img src="img/3.jpg" alt="图片3" class="xzx_img" onerror="this.src='https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=800&h=500&fit=crop'">
                    <div class="xzx_glow"></div>
                    <div class="xzx_caption">旷野晨光 · 朝气蓬勃</div>
                </div>
            </div>
            <div class="xzx_frame">
                <div class="xzx_frame_inner">
                    <img src="img/a1.jpg" alt="图片a1" class="xzx_img" onerror="this.src='https://images.unsplash.com/photo-1418065460487-3e41a6c84dc5?w=800&h=500&fit=crop'">
                    <div class="xzx_glow"></div>
                    <div class="xzx_caption">森林秘境 · 生机盎然</div>
                </div>
            </div>
            <div class="xzx_frame">
                <div class="xzx_frame_inner">
                    <img src="img/a2.jpg" alt="图片a2" class="xzx_img" onerror="this.src='https://images.unsplash.com/photo-1508739773434-c26b3d09e071?w=800&h=500&fit=crop'">
                    <div class="xzx_glow"></div>
                    <div class="xzx_caption">高山云海 · 雄伟壮丽</div>
                </div>
            </div>
            <div class="xzx_frame">
                <div class="xzx_frame_inner">
                    <img src="img/a3.jpg" alt="图片a3" class="xzx_img" onerror="this.src='https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=800&h=500&fit=crop'">
                    <div class="xzx_glow"></div>
                    <div class="xzx_caption">海岸风光 · 波澜壮阔</div>
                </div>
            </div>
        </div>
    </div>

    <a href="index.html" class="xzx_back_btn">返回首页</a>

    <script>
        const xzx_gallery = document.getElementById('xzx_gallery');
        const xzx_frames = document.querySelectorAll('.xzx_frame');
        const xzx_particles = document.getElementById('xzx_particles');

        // 将画框均匀分布在圆环上
        xzx_frames.forEach((frame, index) => {
            const angle = (360 / xzx_frames.length) * index;
            const radius = 650;
            frame.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;
        });

        // 鼠标控制视角
        let xzx_mouseX = 0;
        let xzx_mouseY = 0;
        let xzx_targetRotationY = 0;
        let xzx_targetRotationX = 0;

        document.addEventListener('mousemove', (e) => {
            const xzx_centerX = window.innerWidth / 2;
            const xzx_centerY = window.innerHeight / 2;
            xzx_mouseX = (e.clientX - xzx_centerX) / xzx_centerX;
            xzx_mouseY = (e.clientY - xzx_centerY) / xzx_centerY;
            xzx_targetRotationY = xzx_mouseX * 15;
            xzx_targetRotationX = -xzx_mouseY * 10;
        });

        function xzx_animate() {
            const xzx_scene = document.querySelector('.xzx_scene');
            xzx_scene.style.transform = `rotateX(${xzx_targetRotationX}deg) rotateY(${xzx_targetRotationY}deg)`;
            requestAnimationFrame(xzx_animate);
        }
        xzx_animate();

        // 创建粒子效果
        for (let i = 0; i < 80; i++) {
            const xzx_particle = document.createElement('div');
            xzx_particle.className = 'xzx_particle';
            xzx_particle.style.left = Math.random() * 100 + 'vw';
            xzx_particle.style.top = Math.random() * 100 + 'vh';
            xzx_particle.style.animationDelay = Math.random() * 20 + 's';
            xzx_particle.style.animationDuration = (15 + Math.random() * 15) + 's';
            xzx_particles.appendChild(xzx_particle);
        }

        // 点击画框放大全屏预览（增强交互）
        xzx_frames.forEach((frame, index) => {
            frame.addEventListener('click', (e) => {
                if (e.target.closest('.xzx_frame').classList.contains('xzx_active')) {
                    e.target.closest('.xzx_frame').classList.remove('xzx_active');
                    xzx_gallery.style.animationPlayState = 'running';
                    xzx_gallery.querySelectorAll('.xzx_frame').forEach(f => {
                        const idx = Array.from(xzx_gallery.querySelectorAll('.xzx_frame')).indexOf(f);
                        const angle = (360 / xzx_frames.length) * idx;
                        const radius = 650;
                        f.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;
                        f.style.opacity = '1';
                    });
                } else {
                    xzx_gallery.style.animationPlayState = 'paused';
                    xzx_gallery.querySelectorAll('.xzx_frame').forEach(f => {
                        f.classList.remove('xzx_active');
                        f.style.opacity = '0.3';
                    });
                    frame.classList.add('xzx_active');
                    frame.style.opacity = '1';
                    frame.style.transform = 'translateZ(400px) rotateY(0deg) scale(1.5)';
                }
            });
        });
    </script>
</body>
</html>
